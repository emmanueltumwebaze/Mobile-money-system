<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoMo Pay - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <div class="login-card">
      <!-- Logo -->
      <div class="logo-wrapper">
        <div class="logo-circle">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 7C2 5.89543 2.89543 5 4 5H18C19.1046 5 20 5.89543 20 7V17C20 18.1046 19.1046 19 18 19H4C2.89543 19 2 18.1046 2 17V7Z" fill="#1F13A3"/>
            <circle cx="16" cy="12" r="2" fill="#F13A3"/>
            <path d="M20 9H18.5V15H20C21.1046 15 22 14.1046 22 13V11C22 9.89543 21.1046 9 20 9Z" fill="#1F13A3"/>
          </svg>
        </div>
        <p style="font-size:18px; font-weight:bold; color:#1F13A3; margin-top:4px; text-align:center;">MoMo Pay</p>
      </div>

      <h1 class="welcome">Welcome Back!</h1>
      <p class="subtitle">sign in to continue</p>

      <!-- Error Message -->
      <div id="errorBox" class="error-box" style="display: none;"></div>

      <!-- Phone Number -->
      <div class="input-group">
        <label for="phone">Phone Number</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M6.62 10.79C8.06 13.62 10.38 15.94 13.21 17.38L15.41 15.18C15.69 14.9 16.08 14.82 16.43 14.93C17.55 15.3 18.75 15.5 20 15.5C20.55 15.5 21 15.95 21 16.5V20C21 20.55 20.55 21 20 21C10.61 21 3 13.39 3 4C3 3.45 3.45 3 4 3H7.5C8.05 3 8.5 3.45 8.5 4C8.5 5.25 8.7 6.45 9.07 7.57C9.18 7.92 9.1 8.31 8.82 8.59L6.62 10.79Z" fill="#555"/>
            </svg>
          </span>
          <input type="tel" id="phone" placeholder="0782365986" maxlength="15" autocomplete="tel">
        </div>
      </div>

      <!-- PIN -->
      <div class="input-group">
        <label for="pin">PIN</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M18 8H17V6C17 3.24 14.76 1 12 1C9.24 1 7 3.24 7 6V8H6C4.9 8 4 8.9 4 10V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V10C20 8.9 19.1 8 18 8ZM12 3C13.66 3 15 4.34 15 6V8H9V6C9 4.34 10.34 3 12 3ZM18 20H6V10H18V20ZM12 17C13.1 17 14 16.1 14 15C14 13.9 13.1 13 12 13C10.9 13 10 13.9 10 15C10 16.1 10.9 17 12 17Z" fill="#555"/>
            </svg>
          </span>
          <input type="password" id="pin" placeholder="••••••" maxlength="6" autocomplete="current-password">
        </div>
      </div>

      <a href="#" class="forgot-link">forgot PIN?</a>

      <!-- Login Button -->
      <button type="button" id="loginBtn" class="login-btn">Login</button>

      <!-- Links -->
      <p class="signup-text">Don't have an account? <a href="#">sign up</a></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
