<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoMo Pay - Send Money</title>
  <link rel="stylesheet" href="send-money.css">
</head>
<body>
  <div class="phone-frame">
    <!-- Header -->
    <header class="header">
      <button class="back-btn" id="backBtn" aria-label="Go back" title="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M20 11H7.83L13.42 5.41L12 4L4 12L12 20L13.41 18.59L7.83 13H20V11Z" fill="white"/>
        </svg>
      </button>
      <h1 class="header-title">Send Money</h1>
      <div class="header-spacer"></div>
    </header>

    <div class="content">
      <!-- Available Balance -->
      <div class="balance-info">
        <span class="balance-label">Available balance</span>
        <span class="balance-value" id="availableBalance">UGX 152,400</span>
      </div>

      <!-- Error Message -->
      <div id="errorBox" class="error-box" style="display: none;"></div>

      <!-- Success Message -->
      <div id="successBox" class="success-box" style="display: none;"></div>

      <!-- Recipient Phone -->
      <div class="input-group">
        <label for="recipient">Recipient phone number</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M6.62 10.79C8.06 13.62 10.38 15.94 13.21 17.38L15.41 15.18C15.69 14.9 16.08 14.82 16.43 14.93C17.55 15.3 18.75 15.5 20 15.5C20.55 15.5 21 15.95 21 16.5V20C21 20.55 20.55 21 20 21C10.61 21 3 13.39 3 4C3 3.45 3.45 3 4 3H7.5C8.05 3 8.5 3.45 8.5 4C8.5 5.25 8.7 6.45 9.07 7.57C9.18 7.92 9.1 8.31 8.82 8.59L6.62 10.79Z" fill="#555"/>
            </svg>
          </span>
          <input type="tel" id="recipient" placeholder="+256782365986" maxlength="15">
        </div>
      </div>

      <!-- Amount -->
      <div class="input-group">
        <label for="amount">Amount UGX</label>
        <div class="input-wrapper">
          <span class="currency-prefix">UGX</span>
          <input type="number" id="amount" placeholder="50,000" min="500" step="100">
        </div>
      </div>

      <!-- Reason -->
      <div class="input-group">
        <label for="reason">Reason</label>
        <div class="input-wrapper">
          <input type="text" id="reason" placeholder="Lunch payment" maxlength="50">
        </div>
      </div>

      <!-- Fee & Total Summary -->
      <div class="summary-card">
        <div class="summary-row">
          <span class="summary-label">Fee</span>
          <span class="summary-value" id="feeDisplay">UGX 0</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-row total-row">
          <span class="summary-label">Total</span>
          <span class="summary-value total-value" id="totalDisplay">UGX 0</span>
        </div>
      </div>

      <!-- Fee Note -->
      <p class="fee-note" id="feeNote">Fee is calculated based on the amount you send</p>

      <!-- Continue Button -->
      <button type="button" id="continueBtn" class="continue-btn">Continue</button>
    </div>
  </div>

  <script src="send-money.js"></script>
</body>
</html>
