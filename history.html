<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoMo Pay - Transaction History</title>
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <div class="phone-frame">
    <!-- Header -->
    <header class="header">
      <button class="back-btn" id="backBtn" aria-label="Go back" title="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M20 11H7.83L13.42 5.41L12 4L4 12L12 20L13.41 18.59L7.83 13H20V11Z" fill="white"/>
        </svg>
      </button>
      <h1 class="header-title">Transaction History</h1>
      <div class="header-spacer"></div>
    </header>

    <div class="content">
      <!-- Search -->
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M15.5 14H14.71L14.43 13.73C15.41 12.59 16 11.11 16 9.5C16 5.91 13.09 3 9.5 3C5.91 3 3 5.91 3 9.5C3 13.09 5.91 16 9.5 16C11.11 16 12.59 15.41 13.73 14.43L14 14.71V15.5L19 20.49L20.49 19L15.5 14ZM9.5 14C7.01 14 5 11.99 5 9.5C5 7.01 7.01 5 9.5 5C11.99 5 14 7.01 14 9.5C14 11.99 11.99 14 9.5 14Z" fill="#888"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search transactions">
      </div>

      <!-- Filter Tabs -->
      <div class="filter-tabs">
        <button class="tab active" data-filter="today" id="tabToday">Today</button>
        <button class="tab" data-filter="week" id="tabWeek">Week</button>
        <button class="tab" data-filter="all" id="tabAll">All</button>
      </div>

      <!-- Transaction count -->
      <p class="tx-count" id="txCount">4 transactions</p>

      <!-- Transaction List -->
      <div class="tx-list" id="txList">
        <!-- Filled by JavaScript -->
      </div>

      <!-- Empty state -->
      <div class="empty-state" id="emptyState" style="display: none;">
        <p>No transactions found</p>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item" id="navHome" title="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M10 20V14H14V20H19V12H22L12 3L2 12H5V20H10Z" fill="#888"/>
        </svg>
        <span>Home</span>
      </button>
      <button class="nav-item" id="navPay" title="Pay">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M20 4H4C2.89 4 2.01 4.89 2.01 6L2 18C2 19.11 2.89 20 4 20H20C21.11 20 22 19.11 22 18V6C22 4.89 21.11 4 20 4ZM20 18H4V12H20V18ZM20 8H4V6H20V8Z" fill="#888"/>
        </svg>
        <span>Pay</span>
      </button>
      <button class="nav-item active" id="navHistory" title="History">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M13 3C8.03 3 4 7.03 4 12H1L4.96 15.96L5.03 16.1L9 12H6C6 8.13 9.13 5 13 5C16.87 5 20 8.13 20 12C20 15.87 16.87 19 13 19C11.07 19 9.32 18.21 8.06 16.94L6.64 18.36C8.27 19.99 10.51 21 13 21C17.97 21 22 16.97 22 12C22 7.03 17.97 3 13 3ZM12 8V13L16.28 15.54L17 14.33L13.5 12.25V8H12Z" fill="#0052CC"/>
        </svg>
        <span>History</span>
      </button>
      <button class="nav-item" id="navProfile" title="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" fill="#888"/>
        </svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script src="history.js"></script>
</body>
</html>
