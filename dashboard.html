<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoMo Pay - Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="phone-frame">
    <!-- Status Bar Spacer -->
    <div class="status-bar"></div>

    <!-- Header -->
    <header class="header">
      <h1 class="header-title">Dashboard</h1>
      <button class="header-btn" id="notificationBtn" aria-label="Notifications" title="Notifications">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 22C13.1 22 14 21.1 14 20H10C10 21.1 10.9 22 12 22ZM18 16V11C18 7.93 16.36 5.36 13.5 4.68V4C13.5 3.17 12.83 2.5 12 2.5C11.17 2.5 10.5 3.17 10.5 4V4.68C7.63 5.36 6 7.92 6 11V16L4 18V19H20V18L18 16Z" fill="white"/>
        </svg>
      </button>
    </header>

    <!-- Balance Card -->
    <section class="balance-card">
      <p class="balance-label">Available balance</p>
      <div class="balance-row">
        <h2 class="balance-amount" id="balanceAmount">UGX 152,400</h2>
        <button class="eye-btn" id="toggleBalance" aria-label="Toggle balance visibility" title="Show / Hide balance">
          <svg id="eyeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5C17 19.5 21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.34 13.66 9 12 9Z" fill="#333"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- Actions -->
    <section class="actions-section">
      <h3 class="section-title">Actions</h3>
      <div class="actions-grid">
        <button class="action-btn" id="sendMoneyBtn" title="Send Money">
          <div class="action-icon send">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z" fill="white"/>
            </svg>
          </div>
          <span class="action-label">Send Money</span>
        </button>

        <button class="action-btn" id="billsBtn" title="Pay Bills">
          <div class="action-icon bills">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2ZM16 18H8V16H16V18ZM16 14H8V12H16V14ZM13 9V3.5L18.5 9H13Z" fill="white"/>
            </svg>
          </div>
          <span class="action-label">Bills</span>
        </button>

        <button class="action-btn" id="withdrawBtn" title="Withdraw">
          <div class="action-icon withdraw">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M5 9V7C5 4.24 7.24 2 10 2H14C16.76 2 19 4.24 19 7V9H20C21.1 9 22 9.9 22 11V20C22 21.1 21.1 22 20 22H4C2.9 22 2 21.1 2 20V11C2 9.9 2.9 9 4 9H5ZM7 7V9H17V7C17 5.34 15.66 4 14 4H10C8.34 4 7 5.34 7 7ZM12 17C13.1 17 14 16.1 14 15C14 13.9 13.1 13 12 13C10.9 13 10 13.9 10 15C10 16.1 10.9 17 12 17Z" fill="white"/>
            </svg>
          </div>
          <span class="action-label">Withdraw</span>
        </button>

        <button class="action-btn" id="dataBtn" title="Buy Data">
          <div class="action-icon data">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M17 1.01L7 1C5.9 1 5 1.9 5 3V21C5 22.1 5.9 23 7 23H17C18.1 23 19 22.1 19 21V3C19 1.9 18.1 1.01 17 1.01ZM17 19H7V5H17V19Z" fill="white"/>
            </svg>
          </div>
          <span class="action-label">Data</span>
        </button>
      </div>
    </section>

    <!-- Recent Transactions -->
    <section class="transactions-section">
      <div class="transactions-header">
        <h3 class="section-title">Recent transactions</h3>
        <a href="#" class="see-all" id="seeAllLink">See all</a>
      </div>

      <div class="transaction-list">
        <div class="transaction-item">
          <div class="tx-icon received">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M16 17L12 13L8 17" stroke="#1a8f3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 13V21" stroke="#1a8f3c" stroke-width="2" stroke-linecap="round"/>
              <path d="M20.39 18.39C21.36 17.53 22 16.33 22 15C22 12.79 20.21 11 18 11C17.66 11 17.33 11.04 17.01 11.12C16.07 8.12 13.32 6 10 6C6.13 6 3 9.13 3 13C3 13.14 3 13.28 3.01 13.42C1.25 14.18 0 15.92 0 18C0 20.76 2.24 23 5 23H19C21.21 23 23 21.21 23 19C23 17.69 22.37 16.51 21.39 15.72" stroke="#1a8f3c" stroke-width="1.5"/>
            </svg>
          </div>
          <div class="tx-details">
            <p class="tx-title">Received UGX 5,000</p>
            <p class="tx-subtitle">From Jane Peth</p>
          </div>
          <div class="tx-amount positive">+ UGX 5,000</div>
        </div>

        <div class="transaction-item">
          <div class="tx-icon sent">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M22 2L11 13" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
              <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="tx-details">
            <p class="tx-title">Sent UGX 10,000</p>
            <p class="tx-subtitle">To John</p>
          </div>
          <div class="tx-amount negative">- UGX 10,000</div>
        </div>
      </div>
    </section>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" id="navHome" title="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M10 20V14H14V20H19V12H22L12 3L2 12H5V20H10Z" fill="#0052CC"/>
        </svg>
        <span>Home</span>
      </button>
      <button class="nav-item" id="navPay" title="Pay">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M20 4H4C2.89 4 2.01 4.89 2.01 6L2 18C2 19.11 2.89 20 4 20H20C21.11 20 22 19.11 22 18V6C22 4.89 21.11 4 20 4ZM20 18H4V12H20V18ZM20 8H4V6H20V8Z" fill="#888"/>
        </svg>
        <span>Pay</span>
      </button>
      <button class="nav-item" id="navHistory" title="History">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M13 3C8.03 3 4 7.03 4 12H1L4.96 15.96L5.03 16.1L9 12H6C6 8.13 9.13 5 13 5C16.87 5 20 8.13 20 12C20 15.87 16.87 19 13 19C11.07 19 9.32 18.21 8.06 16.94L6.64 18.36C8.27 19.99 10.51 21 13 21C17.97 21 22 16.97 22 12C22 7.03 17.97 3 13 3ZM12 8V13L16.28 15.54L17 14.33L13.5 12.25V8H12Z" fill="#888"/>
        </svg>
        <span>History</span>
      </button>
      <button class="nav-item" id="navProfile" title="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" fill="#888"/>
        </svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
